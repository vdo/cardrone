; CARDRONE - CSI-modulated drone synth for M5Stack Cardputer ADV
; Flash: pio run -t upload            (Cardputer)
;        pio run -e heltec -t upload  (Heltec WiFi LoRa 32 V3, for LoRa mode)
[platformio]
default_envs = cardrone

[env:cardrone]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
extra_scripts = post:merge_bin.py  ; writes cardrone.bin (flash at 0x0)
lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    jgromes/RadioLib@7.7.1  ; LoRa mode: the Cap LoRa-1262's SX1262
build_src_filter = +<*> -<heltec/>
; StampS3 has no PSRAM: everything lives in internal DRAM.
build_unflags =
    -DARDUINO_RUNNING_CORE=1  ; board default
    -Os  ; Arduino default: no inlining, ~40 calls per audio sample
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0  ; UI loop next to WiFi, core 1 left to audio
    -O2

; The other end of LoRa mode: sends the packets the Cardputer measures (src/heltec/).
[env:heltec]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
extra_scripts = post:merge_bin.py  ; writes cardrone-heltec.bin (flash at 0x0)
lib_deps =
    jgromes/RadioLib@7.7.1
    olikraus/U8g2@2.36.18  ; the OLED
build_src_filter = +<heltec/>
