; CARDRONE - CSI-modulated drone synth for M5Stack Cardputer ADV
; Flash: pio run -t upload
[env:cardrone]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
extra_scripts = post:merge_bin.py  ; writes cardrone.bin (flash at 0x0)
lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    h2zero/NimBLE-Arduino@1.4.3  ; BLE MIDI: about half the RAM of the built-in Bluedroid stack
; StampS3 has no PSRAM: everything lives in internal DRAM.
build_unflags =
    -DARDUINO_RUNNING_CORE=1  ; board default
    -Os  ; Arduino default: no inlining, ~40 calls per audio sample
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0  ; UI loop next to WiFi, core 1 left to audio
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED  ; BLE MIDI is a peripheral only: less RAM
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -O2
